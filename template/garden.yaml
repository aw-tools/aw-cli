# Hand-editable garden configuration.
#
# The tree definitions are generated from `workspace.toml` into
# `.aw/trees.yaml` by `aw bootstrap`, and included below. `aw` never rewrites
# this file, so custom commands added here survive every regeneration.
#
# See https://garden-rs.gitlab.io for the command syntax.

garden:
  includes:
    - .aw/trees.yaml

commands:
  # Example: run over every tree with `garden cmd @* branch`.
  branch: git branch --show-current
