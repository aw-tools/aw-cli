# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """# Changelog

Every change a user of `aw` would notice is listed here, newest first. The
format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and
versions follow [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
{{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}
{% endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "### Added" },
  { message = "^fix", group = "### Fixed" },
  { message = "^doc", group = "### Documentation" },
  { message = "^perf", group = "### Performance" },
  { message = "^refactor", group = "### Changed" },
  { message = "^chore", group = "### Changed" },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^Initial commit", skip = true },
]
filter_commits = false
tag_pattern = "v[0-9].*"
