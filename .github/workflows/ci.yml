name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A cache unread for 7 days is deleted; this run reads main's caches weekly
  # so a quiet spell does not leave the next pull request to rebuild them.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VALE_VERSION: 3.22.0
  VALE_SHA256: 52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # On a pull request every other job runs only when a file in its area
  # changed; the areas live in .github/filters.yml. On main, only the jobs that
  # save a cache run, and only when warm is true.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      fmt: ${{ steps.filter.outputs.fmt }}
      deny: ${{ steps.filter.outputs.deny }}
      e2e: ${{ steps.filter.outputs.e2e }}
      prose: ${{ steps.filter.outputs.prose }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
      changelog: ${{ steps.filter.outputs.changelog }}
      changelog-entry: ${{ steps.filter.outputs.changelog-entry }}
      warm: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.keys.outputs.cache == 'true' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which areas changed
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yml

      - name: Decide whether a cache key changed
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: keys
        with:
          filters: .github/filters.yml

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.fmt == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Install dprint
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: dprint@0.55.2

      - name: Check formatting
        run: just fmt

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Lint with clippy
        run: just clippy

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Run the tests
        run: just test

  msrv:
    name: MSRV (1.85.0)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""
          toolchain: "1.85.0"

      - name: Check against the minimum Rust version
        run: cargo check --locked --all-targets

  doc:
    name: Doc
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Build the documentation
        run: just doc

  deny:
    name: Deny
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-deny

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Audit the dependencies
        run: just deny

  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      # `aw` shells out to garden; the e2e harness needs it on PATH. Pinned to
      # the version doctor's MIN_VERSION floor (2.6) expects, matching local.
      - name: Install garden
        run: cargo install --locked garden-tools --version 2.6.1

      - name: Run the end-to-end tests
        run: just e2e

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          rustflags: ""
          target: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: cargo-zigbuild@0.20.0

      - name: Cross-compile the binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

  prose:
    name: Prose
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Install Vale
        run: |
          curl -fsSLo vale.tar.gz "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz -C /usr/local/bin vale
          vale --version

      - name: Lint the prose
        run: just vale

      - name: Check the word budget
        run: just budget
        if: success() || failure()

      - name: Test the prose lint rules
        run: just test-lint
        if: success() || failure()

  scripts:
    name: Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Install shellcheck
        run: |
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Lint the scripts
        run: just shellcheck

  workflows:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6ef672efc2b5aabc787a9e94baf4989aa02a97df # v2.70.3
        with:
          tool: just

      - name: Install actionlint
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version

      - name: Lint the workflows
        run: just actionlint

  changelog:
    name: Changelog
    needs: changes
    if: needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A change under src/ is one a user of the binary may notice, so it
      # carries a changelog entry or the no-changelog label. Labels are read
      # at run time, so labelling and re-running the job is enough.
      - name: Require a changelog entry or the no-changelog label
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY: ${{ needs.changes.outputs.changelog-entry }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$ENTRY" == "true" ]]; then
            echo "CHANGELOG.md changed."
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" --jq '.[].name' | grep -qx 'no-changelog'; then
            echo "Labelled no-changelog."
            exit 0
          fi
          echo "src/ changed without a CHANGELOG.md entry. Add one under [Unreleased] or label the pull request no-changelog."
          exit 1

  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - fmt
      - clippy
      - test
      - msrv
      - doc
      - deny
      - e2e
      - cross-compile
      - prose
      - scripts
      - workflows
      - changelog
    if: always()
    steps:
      - name: Check all jobs
        run: |
          # The changes job must succeed and every other job must succeed or be
          # skipped by its filter.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Detecting changes ended with result: ${{ needs.changes.result }}"
            exit 1
          fi
          results=("${{ needs.fmt.result }}" "${{ needs.clippy.result }}" "${{ needs.test.result }}" "${{ needs.msrv.result }}" "${{ needs.doc.result }}" "${{ needs.deny.result }}" "${{ needs.e2e.result }}" "${{ needs.cross-compile.result }}" "${{ needs.prose.result }}" "${{ needs.scripts.result }}" "${{ needs.workflows.result }}" "${{ needs.changelog.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" == "success" || "$r" == "skipped" ]]; then continue; fi
            echo "Job failed with result: $r"
            exit 1
          done
