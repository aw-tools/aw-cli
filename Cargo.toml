[package]
name = "agentic-workspace"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Provision and report on reproducible multi-repository agentic workspaces"

[[bin]]
name = "aw"
path = "src/main.rs"

[dependencies]
# CLI parsing; derive keeps the verb surface declarative.
# Error context across subprocess and filesystem boundaries.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Group-wide signalling: std's Child::kill reaches only the leader PID, so
# terminating the child's whole process group on a timeout needs a negative-PID
# kill, which rustix wraps without reintroducing unsafe.
rustix = { version = "1", features = ["process"] }
# Manifest is the single source of truth; parsed once into typed structs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Forward an interactive Ctrl-C to the bounded child group: the thread-based
# API reacts off the handler, so the group kill runs without unsafe.
signal-hook = "0.3"
toml = "0.9"
toml_edit = "0.22"

[dev-dependencies]
# CLI integration tests: spawn the binary and assert on its output.
assert_cmd = "2"
predicates = "3"
# Isolated, RAII-cleaned temporary directories for filesystem tests.
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = true
opt-level = "z"
