# Lint for the human-facing documents. Prose rules live in .vale/styles/Guide,
# a copy of the agentic-workspace repository's style; changelog rules live in
# .vale/styles/Changelog. The word budget is a separate check,
# bin/lint-docs-budget.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[README.md]
BasedOnStyles = Guide

[docs/*.md]
BasedOnStyles = Guide

# A changelog states what changed, so the guide's ban on changelog prose is off
# here and the Changelog style shapes the entries instead.
[CHANGELOG.md]
BasedOnStyles = Guide, Changelog
Guide.Changelog = NO

[.vale/fixtures/violations.md]
BasedOnStyles = Guide

[.vale/fixtures/changelog.md]
BasedOnStyles = Guide, Changelog
Guide.Changelog = NO
